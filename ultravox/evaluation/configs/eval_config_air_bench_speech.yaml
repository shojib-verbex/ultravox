model: "fixie-ai/ultravox-v0_6-llama-3_1-8b"

report_logs_to: ["wandb"]
output_dir: "./output"

# AIR-Bench Speech Tasks Only
# Subset of AIR-Bench focusing on speech understanding tasks

eval_sets:
  - name: air-bench-speaker-gender
  - name: air-bench-speaker-age
  - name: air-bench-speaker-emotion
  - name: air-bench-speaker-intent
  - name: air-bench-language-id
  - name: air-bench-synthesized-voice

eval_dataset_args:
  max_samples: 2000

eval_batch_size: 4
